<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You have found me!</title>
<meta name="description" content="Gone fishing. Probably.">
<style>
  :root {
    --sky: #b8d8e8;
    --hill: #5a8a3c;
    --brown: #6a3c1b;
    --blue: #0b4ea2;
    --red: #d3241c;
    --water: #4c8db3;
    --ink: #15222b;
    --sans: "Transport", "Frutiger", "Segoe UI", "Helvetica Neue", Arial, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--sky); color: var(--ink); font: 400 16px/1.4 var(--sans); }
  h1, p, ul, li { margin: 0; padding: 0; }
  ul { list-style: none; }
  button { font: inherit; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; box-shadow: 0 0 0 7px #fff; }

  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }

  /* Posts and grass mounds that every sign stands on */
  .stake {
    position: relative; width: 12px; height: 40px; flex: none;
    background: linear-gradient(90deg, #8b949a, #bcc3c8 45%, #8b949a);
  }
  .stake::after {
    content: ""; position: absolute; left: 50%; bottom: -9px; width: 76px; height: 18px;
    transform: translateX(-50%); background: var(--hill); border-radius: 50%;
  }
  .board { position: relative; padding-bottom: 44px; }
  .board .stake { position: absolute; bottom: 0; height: 46px; }
  .board .stake.l { left: 16%; }
  .board .stake.r { right: 16%; }

  /* The sign itself */
  .sign {
    --sign-bg: var(--brown);
    background: var(--sign-bg); color: #fff; border-radius: 14px;
    box-shadow: inset 0 0 0 4px var(--sign-bg), inset 0 0 0 7px #fff;
    padding: 28px 18px 22px; width: 100%;
    display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
    text-decoration: none;
  }
  .sign.blue { --sign-bg: var(--blue); }
  .sign svg { fill: currentColor; color: #fff; }
  .sign .cut { fill: var(--sign-bg); }
  .sign .cutline { fill: none; stroke: var(--sign-bg); stroke-width: 3; stroke-linecap: round; }
  .sign .stroke { fill: none; stroke: currentColor; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
  .pic { width: clamp(92px, 24vw, 150px); height: auto; }
  .caption { font-size: clamp(1.05rem, 2.6vw, 1.3rem); font-weight: 700; line-height: 1.2; }

  /* Hero */
  header.wrap { padding-top: clamp(22px, 5vw, 56px); }
  .hero { max-width: 940px; margin: 0 auto; }
  .hero .sign {
    box-shadow: inset 0 0 0 6px var(--sign-bg), inset 0 0 0 11px #fff;
    padding: clamp(34px, 7vw, 76px) clamp(22px, 5vw, 64px); gap: 14px;
  }
  h1 { font-size: clamp(2.6rem, 9vw, 5.4rem); line-height: 1.02; font-weight: 800; letter-spacing: -0.02em; text-wrap: balance; }
  .hero p { font-size: clamp(1.2rem, 3.6vw, 2rem); font-weight: 600; }

  /* Grid of brown signs */
  main.wrap { margin-top: 84px; }
  .signs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 44px 18px; }
  @media (min-width: 700px) { .signs { grid-template-columns: repeat(3, 1fr); gap: 56px 28px; } }
  .signs li { display: flex; flex-direction: column; align-items: center; }
  .signs li:last-child:nth-child(odd) { grid-column: 1 / -1; }
  @media (min-width: 700px) { .signs li:last-child:nth-child(odd) { grid-column: auto; } }
  .signs .sign, .signs .tri-wrap { max-width: 320px; }
  .signs .sign { flex: 1 1 auto; justify-content: center; }
  .signs li:nth-child(3n+1) .sign, .signs li:nth-child(3n+1) .tri-wrap { transform: rotate(-1.1deg); }
  .signs li:nth-child(3n+2) .sign, .signs li:nth-child(3n+2) .tri-wrap { transform: rotate(0.7deg); }
  .signs li:nth-child(3n) .sign, .signs li:nth-child(3n) .tri-wrap { transform: rotate(-0.4deg); }

  /* Warning triangle with its plate */
  .tri-wrap { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .tri { width: min(210px, 80%); height: auto; }
  .plate {
    background: #fff; color: #000; border: 3px solid #000; border-radius: 6px;
    padding: 7px 12px; font-weight: 700; font-size: clamp(1rem, 2.4vw, 1.2rem); text-align: center; width: 100%;
  }

  /* Pond and the one small joke */
  .pond {
    margin-top: 96px; padding: 64px 16px 56px; background: var(--hill);
    border-radius: 50% 50% 0 0 / 70px 70px 0 0;
  }
  .water {
    width: min(460px, 100%); min-height: 210px; margin: 0 auto; padding: 30px 28px 26px;
    background: var(--water); border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center;
  }
  .cast { background: none; border: 0; color: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 700; font-size: 1.15rem; padding: 6px 14px; border-radius: 10px; }
  .cast svg { width: 64px; height: auto; display: block; }
  #catch { min-height: 1.5em; color: #fff; font-weight: 600; font-size: 1.15rem; }
  @media (prefers-reduced-motion: no-preference) {
    .cast .float { animation: bob 3.4s ease-in-out infinite; }
    .cast.tug .float { animation: tug 0.7s ease-out; }
    @keyframes bob { 50% { transform: translateY(3px); } }
    @keyframes tug { 0% { transform: translateY(0); } 25% { transform: translateY(14px); } 55% { transform: translateY(-3px); } 100% { transform: translateY(0); } }
  }
</style>
</head>
<body>

<header class="wrap">
  <div class="hero board">
    <div class="sign blue">
      <h1>You have found me!</h1>
      <p>Gone fishing. Probably.</p>
    </div>
    <span class="stake l" aria-hidden="true"></span>
    <span class="stake r" aria-hidden="true"></span>
  </div>
</header>

<main class="wrap">
  <ul class="signs">

    <li>
      <div class="sign">
        <svg class="pic" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <path d="M6 33c9-15 28-15 40 0-12 15-31 15-40 0z"/>
          <path d="M44 33l15-12v24z"/>
          <circle class="cut" cx="18" cy="30" r="2.6"/>
          <path class="cutline" d="M29 24c3 5 3 12 0 18"/>
          <path class="stroke" d="M12 6v14"/>
        </svg>
        <p class="caption">Waits for fish</p>
      </div>
      <span class="stake" aria-hidden="true"></span>
    </li>

    <li>
      <div class="sign">
        <svg class="pic" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <path d="M8 40l17-9 6 11-21 7z"/>
          <path d="M35 36l19 1 5 9-21 4z"/>
          <path d="M24 53l9 1-2 7-9-2z"/>
          <circle cx="16" cy="25" r="2.4"/>
          <circle cx="47" cy="27" r="2.2"/>
          <circle cx="53" cy="17" r="1.8"/>
          <path class="stroke" d="M31 25V9M17 20l-7-7M45 19l7-7"/>
        </svg>
        <p class="caption">Clays feel nervous</p>
      </div>
      <span class="stake" aria-hidden="true"></span>
    </li>

    <li>
      <div class="sign">
        <svg class="pic" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <path d="M3 46V24a5 5 0 0 1 5-5h32c5 0 9 3 11 8l7 10c1 2 2 3 2 5v4z"/>
          <rect class="cut" x="9" y="25" width="13" height="10" rx="1.5"/>
          <path class="cut" d="M27 25h12l6 10H27z"/>
          <circle class="cut" cx="17" cy="47" r="9"/>
          <circle class="cut" cx="48" cy="47" r="9"/>
          <circle cx="17" cy="47" r="6.5"/>
          <circle cx="48" cy="47" r="6.5"/>
          <circle class="cut" cx="17" cy="47" r="2.6"/>
          <circle class="cut" cx="48" cy="47" r="2.6"/>
        </svg>
        <p class="caption">Parks anywhere. Allegedly.</p>
      </div>
      <span class="stake" aria-hidden="true"></span>
    </li>

    <li>
      <div class="sign">
        <svg class="pic" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <circle cx="32" cy="19" r="8"/>
          <path class="stroke" d="M32 3v4M32 31v4M16 19h4M44 19h4M23.5 10.5l-2.8-2.8M40.5 10.5l2.8-2.8M23.5 27.5l-2.8 2.8M40.5 27.5l2.8 2.8"/>
          <path d="M10 58l7-17h30l7 17z"/>
          <path class="cutline" d="M32 41v17M13.5 49.5h37"/>
        </svg>
        <p class="caption">Sun pays rent</p>
      </div>
      <span class="stake" aria-hidden="true"></span>
    </li>

    <li>
      <div class="sign">
        <svg class="pic" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <rect x="22" y="26" width="18" height="15"/>
          <rect x="41" y="17" width="7" height="14"/>
          <rect class="cut" x="26" y="30" width="7" height="6" rx="1"/>
          <path d="M6 40h52l-7 14H14z"/>
          <path class="cutline" d="M11 45h42M14 49.5h36"/>
          <path class="stroke" d="M4 59c6-4 8 4 14 0s8 4 14 0 8 4 14 0 8 4 14 0"/>
        </svg>
        <p class="caption">Printing tiny boats</p>
      </div>
      <span class="stake" aria-hidden="true"></span>
    </li>

    <li>
      <div class="sign">
        <svg class="pic" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <path d="M6 42c0-11 11-20 26-20s26 9 26 20c0 4-2 7-6 7H12c-4 0-6-3-6-7z"/>
          <path class="cutline" d="M19 31l6 9M31 28l5 11M43 31l5 8"/>
        </svg>
        <p class="caption">Sourdough has opinions</p>
      </div>
      <span class="stake" aria-hidden="true"></span>
    </li>

    <li>
      <div class="sign">
        <svg class="pic" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <rect x="6" y="5" width="52" height="40" rx="5"/>
          <rect class="cut" x="10" y="9" width="44" height="32" rx="2"/>
          <ellipse cx="32" cy="26" rx="8" ry="11"/>
          <path d="M24.5 21l-6 11 6-3zM39.5 21l6 11-6-3z"/>
          <ellipse class="cut" cx="32" cy="29" rx="4.6" ry="7"/>
          <path d="M26 45h12l3 10H23z"/>
          <rect x="17" y="55" width="30" height="4" rx="2"/>
        </svg>
        <p class="caption">Penguin runs iMac</p>
      </div>
      <span class="stake" aria-hidden="true"></span>
    </li>

    <li>
      <div class="sign">
        <svg class="pic" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <circle class="stroke" cx="14" cy="44" r="10"/>
          <circle class="stroke" cx="50" cy="44" r="10"/>
          <path class="stroke" d="M14 44h17M31 44L26 27M26 27h16M42 27L31 44M42 27l8 17M14 44l12-17M42 27l-2-9h7M22 24h8"/>
          <path d="M56 3l-8 11h5l-4 9 11-13h-5z"/>
        </svg>
        <p class="caption">Cycling, with assistance</p>
      </div>
      <span class="stake" aria-hidden="true"></span>
    </li>

    <li>
      <div class="tri-wrap">
        <svg class="tri" viewBox="0 0 120 106" aria-hidden="true" focusable="false">
          <path d="M60 8L113 99H7z" fill="#fff" stroke="#d3241c" stroke-width="10" stroke-linejoin="round"/>
          <g fill="#111">
            <rect x="34" y="72" width="22" height="18"/>
            <rect x="58" y="72" width="22" height="18"/>
            <rect x="44" y="55" width="22" height="17" transform="rotate(-8 55 63)"/>
            <rect x="56" y="41" width="14" height="13" transform="rotate(14 63 47)"/>
          </g>
        </svg>
        <p class="plate">Projects. Many. Unfinished.</p>
      </div>
      <span class="stake" aria-hidden="true"></span>
    </li>

  </ul>
</main>

<footer class="pond">
  <div class="water">
    <button class="cast" id="cast" type="button">
      <svg viewBox="0 0 40 70" aria-hidden="true" focusable="false">
        <ellipse cx="20" cy="52" rx="17" ry="4.5" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2"/>
        <g class="float">
          <path d="M20 0v20" stroke="#fff" stroke-width="2"/>
          <rect x="18.2" y="18" width="3.6" height="10" fill="#fff"/>
          <path d="M8 42a12 12 0 0 1 24 0z" fill="#d3241c"/>
          <path d="M8 42a12 12 0 0 0 24 0z" fill="#fff"/>
        </g>
      </svg>
      <span>Cast a line</span>
    </button>
    <p id="catch" role="status" aria-live="polite"></p>
  </div>
</footer>

<script>
(function () {
  var catches = ['Old boot. Again.', 'Just some weed.', 'Tiny fish. Returned.', 'Absolutely nothing. Again.', 'Shopping trolley. Lovely.', 'Fish! Imaginary, sadly.'];
  var btn = document.getElementById('cast'), out = document.getElementById('catch'), last = -1, timer;
  btn.addEventListener('click', function () {
    var i;
    do { i = Math.floor(Math.random() * catches.length); } while (i === last);
    last = i;
    out.textContent = catches[i];
    btn.classList.remove('tug');
    void btn.offsetWidth;
    btn.classList.add('tug');
    clearTimeout(timer);
    timer = setTimeout(function () { btn.classList.remove('tug'); }, 800);
  });
})();
</script>
</body>
</html>
